[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "php82Extensions.bcmath",
  "php82Extensions.curl",
  "php82Extensions.dom",
  "php82Extensions.fileinfo",
  "php82Extensions.ftp",
  "php82Extensions.gd",
  "php82Extensions.zip",
  "php82Extensions.mbstring",
  "php82Extensions.openssl",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.intl",
  "php82Extensions.pcntl",
  "nodejs_20"
]

[phases.install]
cmds = [
  "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[phases.build]
cmds = [
  # Dossiers Laravel
  "mkdir -p storage/framework/cache",
  "mkdir -p storage/framework/sessions",
  "mkdir -p storage/framework/views",
  "mkdir -p storage/logs",
  "mkdir -p bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache",

  # Lien symbolique storage
  "php artisan storage:link || true",

  # ── Clears SANS DB (fichiers uniquement) ──────────────────
  # NE PAS utiliser optimize:clear → appelle cache:clear → MySQL requis
  # NE PAS utiliser cache:clear    → MySQL requis (CACHE_STORE=database)
  "php artisan config:clear",
  "php artisan route:clear",
  "php artisan view:clear",

  # ── Caches (fichiers uniquement, pas de DB) ───────────────
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

# Runtime : MySQL accessible → migrate + démarrage
[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"