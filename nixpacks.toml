[phases.setup]
nixPkgs = [
  "php82",
  "composer",  
  "php82Extensions.bcmath",
  "php82Extensions.curl",
  "php82Extensions.dom",
  "php82Extensions.fileinfo",
  "php82Extensions.ftp",
  "php82Extensions.gd",
  "php82Extensions.zip",
  "php82Extensions.mbstring",
  "php82Extensions.openssl",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.intl",
  "php82Extensions.pcntl",
  "nodejs_20"
]

[phases.install]
cmds = [
  "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[phases.build]
cmds = [
  # ── Dossiers obligatoires Laravel ──
  "mkdir -p storage/framework/cache",
  "mkdir -p storage/framework/sessions",
  "mkdir -p storage/framework/views",
  "mkdir -p storage/logs",
  "mkdir -p bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache",

  # ── Migrations : seulement sur le service WEB (pas le Worker) ──
  # Ajouter SKIP_MIGRATIONS=true dans les variables du service Worker
  "if [ \"$SKIP_MIGRATIONS\" != \"true\" ]; then php artisan migrate --force; fi",

  # ── Lien symbolique storage ──
  "php artisan storage:link || true",

  # ── Cache Laravel ──
  "php artisan optimize:clear",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

# ── Service WEB ─────────────────────────────────────────────
# Le service Worker utilise sa propre commande start dans Railway :
# php artisan queue:work --timeout=1800 --tries=1 --sleep=3 --max-jobs=100 --max-time=3600
[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"